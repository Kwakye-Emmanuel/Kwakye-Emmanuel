# Renders a static github-metrics.svg and commits it to the repo, replacing the
# live stat cards. Requires a classic Personal Access Token stored as the
# repo secret METRICS_TOKEN (scopes: repo, read:user).
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kwakye-Emmanuel
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul

          # Language breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          # 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
